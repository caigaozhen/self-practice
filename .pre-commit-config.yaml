repos:
  # 1. 检查提交信息格式（只跑 commit-msg 阶段）
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.2
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # 2. 检查文件和密钥（只跑 pre-commit 阶段）
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
        stages: [pre-commit] # 加这里
      - id: check-merge-conflict
        stages: [pre-commit] # 加这里

  # 3. 检查敏感密钥
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
        stages: [pre-commit] # 加这里